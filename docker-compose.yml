services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: oraqul
      POSTGRES_PASSWORD: oraqul
      POSTGRES_DB: oraqul
    ports:
      - '5433:5432'
    volumes:
      - oraqul-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oraqul']
      interval: 5s
      timeout: 3s
      retries: 10

  # The API for a deployment: docker compose --profile deploy up -d --build
  # Reads .env, with the database reached inside the compose network.
  api:
    profiles: ['deploy']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        CODE_VERSION: ${CODE_VERSION:-}
    env_file: .env
    environment:
      DATABASE_URL: postgres://oraqul:oraqul@db:5432/oraqul
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oraqul-db:
