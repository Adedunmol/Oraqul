services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: oraqul
      POSTGRES_PASSWORD: oraqul
      POSTGRES_DB: oraqul
    ports:
      - '5433:5432'
    volumes:
      - oraqul-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oraqul']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  oraqul-db:
